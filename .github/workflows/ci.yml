name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore src/MonitoringPlatform.sln

      - name: Build solution
        run: dotnet build src/MonitoringPlatform.sln --configuration Release --no-restore

      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config

      - name: Build SensorService image
        run: docker compose -f docker-compose.yml build sensor-service

      - name: Build AlertService image
        run: docker compose -f docker-compose.yml build alert-service
